services:
  - type: web
    name: resolve-service-requests
    runtime: docker
    plan: starter
    region: singapore
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: 'true'
      - key: DATABASE_URL
        fromDatabase:
          name: resolve-db
          property: connectionString
      - key: CLIENT_ORIGIN
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: '587'
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: MAIL_FROM
        sync: false
databases:
  - name: resolve-db
    databaseName: resolve
    user: resolve
    plan: basic-256mb
    region: singapore
    postgresMajorVersion: '16'
    ipAllowList: []
