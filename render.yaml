services:
  - type: web
    name: resolve-service-requests
    runtime: docker
    plan: free
    region: singapore
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: 'true'
      - key: DATABASE_URL
        fromDatabase:
          name: resolve-db
          property: connectionString
      - key: CLIENT_ORIGIN
        sync: false
      - key: SEED_ON_START
        value: 'true'
      - key: SEED_ADMIN_EMAIL
        value: admin@example.com
      - key: SEED_ADMIN_PASSWORD
        generateValue: true
      - key: SEED_USER_PASSWORD
        generateValue: true
databases:
  - name: resolve-db
    databaseName: resolve
    user: resolve
    plan: free
    region: singapore
    postgresMajorVersion: '16'
    ipAllowList: []
